    math:     {status: census, bare: null, t: null}
    # the clean within-generation capability pair with gemma_4_e4b (§6)
  qwen_3_6_27b:
    hotpotqa: {status: census, bare: null, t: null}
    musique:  {status: census, bare: null, t: null}
    gsm8k:    {status: census, bare: null, t: null}
    math:     {status: census, bare: null, t: null}
