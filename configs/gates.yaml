# Difficulty-gate rulings (§4.4) — the committed source of truth for which
# (model, band) slices belong in the census. Until now these lived only in
# comments across mvp_grid.yaml / submit_census*.sh and in ADR 18, so nothing
# could answer "what is still missing" mechanically. `harnesslab progress`
# reads this file and reports gated slices with no store or an unfinished one.
#
# status vocabulary
#   census       full 32-config factorial over the whole benchmark pool
#   thin         4 headline configs only (band saturates the [0.15,0.85] window)
#   dropped      gate failed — outside the window on BOTH BARE and T
#   bridge_only  reserved for the CCI reconciliation arm, not the general grid
#   pending_gate pilot has run; BARE/T not read yet -> no census until it is
#   unprobed     no probe/pilot yet
#   blocked      cannot serve on this stack (reason in note)
#
# bare/t are pilot BARE and T accuracy (N=20 tasks x 2 seeds unless noted);
# null means "not measured / not applicable". Window: [0.15, 0.85].

window: [0.15, 0.85]

models:

  # --- ADR 18, pilot jobs 1034331 / 1034587 ------------------------------
  mistral_small_3_2_24b:
    hotpotqa: {status: census, bare: 0.204, t: 0.183}
    musique:  {status: census, bare: 0.460, t: 0.469}
    math:     {status: census, bare: 0.400, t: 0.300}
    gsm8k:    {status: thin,   bare: 0.875, t: null,
               note: "BARE saturates the window -> 4-config thin arm (mvp_thin_gsm8k.yaml)"}
  qwen_3_5_9b:
    hotpotqa: {status: census, bare: 0.144, t: 0.385,
               note: "BARE within sampling noise of the 0.15 floor (SE~.055) -> admitted, flagged"}
    musique:  {status: census, bare: 0.436, t: 0.397}
    gsm8k:    {status: census, bare: 0.725, t: 0.575}
    math:     {status: census, bare: 0.325, t: 0.225}

