# Bridge arm (§4.2.1): CCI-style coupling — the submission instruction
# lives INSIDE the T block, so BARE-like configs get no submission line at
# all. Llama-3.1-8B is CCI's validated cell; reconciling our decoupled
# instrument against the coupled original validates the re-implementation.
# HOLD until llama_3_1_8b passes probe + pilot gate. Pair with a standard
# decoupled grid slice on the same model.
exp_id: arm_bridge_coupled
benchmark: hotpotqa
model_id: llama_3_1_8b
tasks_file: configs/tasks/hotpotqa.jsonl
n_tasks: 100
k_seeds: 2                    # small by design (§4.2.1) — 32x100x2 = 6400
temp: 0.1
top_p: 0.9
schedule_seed: 20260725
concurrency: 16
throughput_rollouts_per_node_hour: 4000
coupled_submission: true
configs:
  - components: []
  - components: [P]
  - components: [T]
  - components: [M]
  - components: [SR]
  - components: [R]
  - components: [P, T]
  - components: [P, M]
  - components: [P, SR]
  - components: [P, R]
  - components: [T, M]
  - components: [T, SR]
  - components: [T, R]
  - components: [M, SR]
  - components: [M, R]
  - components: [SR, R]
  - components: [P, T, M]
  - components: [P, T, SR]
  - components: [P, T, R]
  - components: [P, M, SR]
  - components: [P, M, R]
  - components: [P, SR, R]
  - components: [T, M, SR]
  - components: [T, M, R]
  - components: [T, SR, R]
  - components: [M, SR, R]
  - components: [P, T, M, SR]
  - components: [P, T, M, R]
  - components: [P, T, SR, R]
  - components: [P, M, SR, R]
  - components: [T, M, SR, R]
  - components: [P, T, M, SR, R]
