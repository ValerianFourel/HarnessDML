# Padding control arm (§4.3.3, CCI §7.1): length-matched meaningless
# pseudo-components vs the real ones — separates component CONTENT from
# prompt-length/position artifacts. One Tier-F model x both bands
# (submit BENCH=hotpotqa,math). Real singles come from the grid; this arm
# adds their padded twins + padded All-In. padded_components is part of
# the cell identity, so nothing collides with grid cells.
exp_id: arm_padding          # overridden per slice
benchmark: hotpotqa          # overridden per slice
model_id: mistral_small_3_2_24b
tasks_file: configs/tasks/hotpotqa.jsonl   # overridden per slice
n_tasks: 100
k_seeds: 5
temp: 0.1
top_p: 0.9
schedule_seed: 20260725
concurrency: 16
throughput_rollouts_per_node_hour: 4000
configs:
  - {components: [P],  padding_components: [P]}
  - {components: [T],  padding_components: [T]}
  - {components: [M],  padding_components: [M]}
  - {components: [SR], padding_components: [SR]}
  - {components: [R],  padding_components: [R]}
  - {components: [P, T, M, SR, R], padding_components: [P, T, M, SR, R]}
