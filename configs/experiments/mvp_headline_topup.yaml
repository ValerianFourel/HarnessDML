# K=10 headline arm (§4.6): the 4 headline configs at 10 seeds, for the
# consistency and pass@k estimands that k=5 estimates too noisily.
#
# It writes its OWN store — run_experiment.sbatch derives the store directory
# from the spec filename, so this lands in
# $SCRATCH/harnesslab/mvp_headline_topup/ rather than resuming into the grid's
# seeds 0-4. That costs re-running seeds 0-4 for these 4x100 cells (~2k
# rollouts per band) and buys a self-contained k=10 store: no cross-store join
# is needed to compute C_out or pass@k, and the grid's targets stay exactly
# 32 x tasks x 5. Verified 2026-07-27: 4,000/4,000 per band, three bands.
exp_id: mvp_headline_topup
benchmark: gsm8k            # overridden per slice
model_id: mistral_small_3_2_24b
tasks_file: configs/tasks/gsm8k.jsonl   # overridden per slice
# 100, NOT the census pool: this arm buys SEEDS (K=10 for the consistency and
# pass@k estimands, §4.6), not tasks. Written when every list was 100 long;
# once the lists grew to census size (ADR 19) a null cap silently meant
# 4 x 7405 x 10 = 296k rollouts on hotpotqa alone — 5 extra seeds on the whole
# capped pool would be ~113k per model, against 6k for the headline 100.
# Raise it deliberately if the consistency SEs need it, never by leaving it null.
n_tasks: 100
k_seeds: 10
temp: 0.1
top_p: 0.9
schedule_seed: 20260724
concurrency: 16
throughput_rollouts_per_node_hour: 4000
configs:
  - components: []                      # BARE
  - components: [T]
  - components: [T, SR, R]
  - components: [P, T, M, SR, R]        # All-In
